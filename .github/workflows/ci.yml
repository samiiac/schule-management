name: ci

on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
   runs-on: ubuntu-latest
   env:
     NODE_ENV: test
     DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
     ACCESS_JWT_SECRET: ci-only-not-real-aaaaaaaaaaaaaaaaaaaaaaaa
     REFRESH_JWT_SECRET: ci-only-not-real-bbbbbbbbbbbbbbbbbbbbbbbb
     ACCESS_TOKEN_EXPIRES_IN_SECS: "900"
     REFRESH_TOKEN_EXPIRES_IN_SECS: "604800"
     
   steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with: 
       node-version: '24'
       cache: 'npm'

    - run: npm ci

    - run: npx prisma generate

    - run: npx vitest run 



